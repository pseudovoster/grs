<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Student Redressal Portal</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-image: url('g.jpg'); /* Replace with your image file */
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      color: white;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: rgba(0, 0, 0, 0.6);
      padding: 10px 20px;
    }

    header h1 {
      margin: 0;
    }

    .top-links {
      display: flex;
      gap: 15px;
    }

    nav {
      margin: 20px;
      display: flex;
      gap: 15px;
    }

    a {
      text-decoration: none;
      color: white;
      font-weight: bold;
    }

    main {
      text-align: center;
      margin-top: 100px;
      background-color: rgba(0, 0, 0, 0.5);
      padding: 20px;
      border-radius: 10px;
      width: 50%;
      margin-left: auto;
      margin-right: auto;
    }
  </style>
</head>
<body>
  <header>
    <h1>Student Redressal Portal</h1>
    <div class="top-links">
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
    </div>
  </header>

  <nav>
    <a href="signup.html">Register</a>
    <a href="login.html">Login</a>
  </nav>

  <main>
    <p>Welcome to the Redressal Portal. Please register or login to file your grievances.</p>
  </main>
</body>
</html>
